[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fettle"
version = "1.7.2"
description = "Cross-distribution Linux system-maintenance and supply-chain tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Paul Asadoorian", email = "paul@rihackers.com" }]
dependencies = []  # runtime: pure standard library, on purpose

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# The web UI (`fettle web`) — the ONLY runtime dependency, and strictly opt-in.
# The core CLI stays pure-stdlib (`dependencies = []`) so the remote zipapp keeps
# working under any bare python3; nothing outside fettle/web/ may import nicegui.
web = ["nicegui>=2"]

[project.urls]
# The README is the front page; the manual is the wiki. Keep both reachable from
# package metadata, since a package is often where someone first meets fettle.
Homepage = "https://github.com/pasadoorian/fettle"
Documentation = "https://github.com/pasadoorian/fettle/wiki"
Changelog = "https://github.com/pasadoorian/fettle/blob/main/CHANGELOG.md"
Releases = "https://github.com/pasadoorian/fettle/releases"

[project.scripts]
fettle = "fettle.cli:main"

[tool.setuptools.packages.find]
include = ["fettle*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Say which rules we lint against rather than inheriting whatever the tool decided this
# week. `dev` pins only `ruff>=0.6`, so CI installs the newest — and ruff 0.16 CHANGED
# ITS DEFAULT SELECTION, turning a clean tree into 267 errors with no code change. That
# broke the release pipeline's first real run, on a tag, without a commit to blame.
#
# This is ruff's classic default set (pycodestyle errors + pyflakes), which is what the
# codebase was written and reviewed against. Adopting the newer rules — import sorting,
# pyupgrade, bandit, blind-except — is worth doing deliberately, as its own change, with
# the ~267 findings read rather than bulk-fixed on the way to a release.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

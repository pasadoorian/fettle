name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.11 is the floor `pyproject.toml` declares, and until this matrix existed
      # nothing tested it — the suite ran on 3.12 only, so "requires-python >= 3.11"
      # was a claim rather than a fact. It is also the version RHEL 9 users install to
      # run fettle at all, which makes it the one most worth proving.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  packages:
    # Build each distro package and INSTALL it in a clean container of that distro.
    # Building only proves the metadata parses; installing proves the layout is right,
    # and the layout is where these go wrong.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: deb — build, install on Debian 12, run
        run: |
          packaging/deb/build.sh
          docker run --rm -v "$PWD/dist":/d:ro debian:12 sh -c '
            apt-get -qq update >/dev/null && apt-get -qq install -y python3 >/dev/null
            dpkg -i /d/fettle_*.deb
            fettle --version
            fettle -H --dry-run | grep -q "Filesystem hygiene"'

      - name: rpm — build, install on Rocky 9, run
        run: |
          docker run --rm -v "$PWD":/src -w /src rockylinux/rockylinux:9 sh -c '
            dnf -q -y install rpm-build python3 >/dev/null
            packaging/rpm/build.sh'
          # Rocky 9's python3 is 3.9, so this also proves the boolean Requires pulls in
          # python3.11 rather than refusing on the whole EL9 family.
          docker run --rm -v "$PWD/dist":/d:ro rockylinux/rockylinux:9 sh -c '
            dnf -q -y install /d/fettle-*.rpm >/dev/null
            fettle --version
            fettle -H --dry-run | grep -q "Filesystem hygiene"'

      - name: arch — build, install on Arch, run
        run: |
          # makepkg refuses to run as root and containers are root by default. Building
          # in a COPY inside the container rather than chown'ing the mounted
          # workspace: chown -R on the bind mount changes ownership on the host too,
          # which breaks every later step in the job.
          docker run --rm -v "$PWD":/src archlinux:latest sh -c '
            pacman -Sy --noconfirm --needed base-devel >/dev/null 2>&1
            useradd -m build
            cp -a /src /home/build/fettle && chown -R build /home/build/fettle
            su build -c "cd /home/build/fettle && packaging/arch/build.sh /home/build/out"
            mkdir -p /src/dist && cp /home/build/out/*.pkg.tar.zst /src/dist/'
          docker run --rm -v "$PWD/dist":/d:ro archlinux:latest sh -c '
            pacman -Sy --noconfirm >/dev/null
            pacman -U --noconfirm /d/fettle-*.pkg.tar.zst >/dev/null
            fettle --version
            fettle -H --dry-run | grep -q "Filesystem hygiene"'
